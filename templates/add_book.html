<!DOCTYPE html>
<html>
<head>
    <title>添加图书 - 图书管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        .header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-container { background-color: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .btn { 
            padding: 10px 15px; 
            text-decoration: none; 
            border: none; 
            border-radius: 3px; 
            cursor: pointer;
            display: inline-block;
        }
        .submit-btn { background-color: #4CAF50; color: white; }
        .cancel-btn { background-color: #f44336; color: white; }
        .user-info { color: white; }
        .admin-badge { background-color: #e74c3c; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-left: 10px; }
        .nav-links { margin-bottom: 20px; }
        .flash-messages { margin-bottom: 20px; }
        .flash-success { background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .flash-error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 图书管理系统</h1>
        <div class="user-info">
            欢迎，{{ user.username }} 
            {% if user.role == 'admin' %}<span class="admin-badge">管理员</span>{% endif %}
            <a href="{{ url_for('logout') }}" class="btn logout-btn">注销</a>
        </div>
    </div>

    <div class="container">
        <div class="nav-links">
            <a href="/" class="btn">🏠 首页</a>
            <a href="/books" class="btn">📖 图书列表</a>
            <a href="/batch_add_books" class="btn">📚 批量添加</a>
        </div>

        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="form-container">
            <h2>添加新书</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="title">书名:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label for="author">作者:</label>
                    <input type="text" id="author" name="author" required>
                </div>
                
                <div class="form-group">
                    <label for="category">分类:</label>
                    <select id="category" name="category">
                        <option value="文学">文学</option>
                        <option value="科技">科技</option>
                        <option value="历史">历史</option>
                        <option value="哲学">哲学</option>
                        <option value="教育">教育</option>
                        <option value="小说">小说</option>
                        <option value="科幻">科幻</option>
                        <option value="未分类" selected>未分类</option>
                    </select>
                </div>
                
                <button type="submit" class="btn submit-btn">添加图书</button>
                <a href="/books" class="btn cancel-btn">取消</a>
            </form>
        </div>
    </div>
</body>
</html>
